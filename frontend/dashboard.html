<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Clinic System</title>
<link rel="stylesheet" href="css/style.css">
<style>
    html, body { height: 100%; margin: 0; }
    .dash-shell { display: flex; height: 100vh; }

    .sidebar {
        width: 220px;
        flex-shrink: 0;
        background: #0f4c81;
        color: #fff;
        display: flex;
        flex-direction: column;
    }
    .sidebar .brand {
        padding: 20px 18px;
        font-size: 16px;
        font-weight: 700;
        border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .sidebar .user-row {
        padding: 12px 18px;
        font-size: 12.5px;
        color: #cfe0f0;
        border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .nav-list {
        list-style: none;
        margin: 0;
        padding: 10px 0;
        flex: 1;
        overflow-y: auto;
    }
    .nav-list li { margin: 2px 10px; }
    .nav-list button {
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: #dbe8f5;
        padding: 10px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .nav-list button:hover { background: rgba(255,255,255,0.08); }
    .nav-list button.active { background: #fff; color: #0f4c81; font-weight: 600; }

    .sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.15); }
    .sidebar-footer button {
        width: 100%;
        background: rgba(255,255,255,0.12);
        color: #fff;
        border: none;
        padding: 9px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
    }
    .sidebar-footer button:hover { background: rgba(255,255,255,0.22); }

    .content-area { flex: 1; height: 100vh; }
    .content-area iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #6b7280;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="dash-shell">
    <div class="sidebar">
        <div class="brand">🏥 Clinic System</div>
        <div class="user-row" id="userLabel">Loading...</div>
        <ul class="nav-list" id="navList"></ul>
        <div class="sidebar-footer">
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <div class="content-area">
        <iframe id="contentFrame" title="Section content"></iframe>
    </div>
</div>

<script src="js/common.js?v=202608161754"></script>
<script src="js/dashboard.js?v=202608161754"></script>
</body>
</html>
