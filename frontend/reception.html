<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reception - Clinic System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <h2>🏥 Reception Desk</h2>
    <div class="user-info">
      <span id="userLabel"></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="container">

    <!-- Search Section -->
    <div class="card">
      <h3>Search Patient</h3>
      <div class="form-grid">
        <div class="field">
          <label>Search by Name or Contact Number</label>
          <input type="text" id="searchInput" placeholder="Type to search...">
        </div>
      </div>
      <div id="searchResults" style="margin-top:14px;"></div>
    </div>

    <!-- Patient History (shown after selecting a search result) -->
    <div class="card" id="historyCard" style="display:none;">
      <h3>Patient History</h3>
      <div id="allergyBanner"></div>
      <div id="patientProfile"></div>
      <div id="visitHistory" style="margin-top:16px;"></div>
    </div>

    <!-- Registration Form -->
    <div class="card">
      <h3>Register New Patient</h3>
      <form id="registerForm">
        <div class="form-grid">
          <div class="field">
            <label>Full Name *</label>
            <input type="text" name="name" required>
          </div>
          <div class="field">
            <label>Contact Number *</label>
            <input type="text" name="contact_number" required>
          </div>
          <div class="field">
            <label>Age</label>
            <input type="number" name="age" min="0" max="130">
          </div>
          <div class="field">
            <label>Patient Type</label>
            <select name="patient_type">
              <option value="Normal">Normal</option>
              <option value="Regular">Regular</option>
              <option value="Monthly">Monthly</option>
            </select>
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label>Address</label>
            <input type="text" name="address">
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label>Known Allergies (shown as alert on future visits)</label>
            <input type="text" name="allergies" placeholder="e.g. Penicillin, Sulfa drugs">
          </div>
          <div class="field">
            <label>Monthly Fee (for Regular/Monthly patients)</label>
            <input type="number" step="0.01" name="monthly_fee">
          </div>
          <div class="field">
            <label>Next Report/Appointment Due Date</label>
            <input type="date" name="report_due_date">
          </div>
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="btn">Register Patient</button>
        </div>
        <p id="registerMsg" style="margin-top:10px; font-size:13.5px;"></p>
      </form>
    </div>

  </div>

  <script src="js/common.js?v=202608161754"></script>
  <script src="js/reception.js?v=202608161754"></script>
</body>
</html>
