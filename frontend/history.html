<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visit History - Clinic System</title>
<link rel="stylesheet" href="css/style.css">
<style>
    .date-picker-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
    .date-picker-row input { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13.5px; }
    .visit-card { border: 1px solid #eef1f4; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .visit-card .visit-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .visit-card .visit-time { font-size: 12.5px; color: #6b7280; }
    .rx-list { margin: 10px 0 0 0; padding-left: 18px; font-size: 13px; }
    .count-line { font-size: 13.5px; color: #374151; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="topbar">
    <h2>📋 Visit History</h2>
    <div class="user-info">
        <span id="userLabel"></span>
        <button id="logoutBtn">Logout</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3>Browse by Date</h3>
        <div class="date-picker-row">
            <input type="date" id="dateInput">
            <button class="btn" id="loadBtn">Search</button>
        </div>
        <div id="countLine" class="count-line"></div>
        <div id="visitsList"></div>
    </div>
</div>

<script src="js/common.js?v=202608161754"></script>
<script src="js/history.js?v=202608161754"></script>
</body>
</html>
